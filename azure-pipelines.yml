trigger:
  branches:
    include: [main, develop]
pr:
  branches:
    include: [main, develop]

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'

stages:
- stage: Validate
  displayName: Validación y pruebas
  jobs:
  - job: BuildAndTest
    displayName: Instalar, validar y probar
    steps:
    - task: UseNode@1
      inputs:
        version: $(nodeVersion)
      displayName: Usar Node.js
    - script: npm ci
      displayName: Instalar dependencias
    - script: npm run check
      displayName: Lint sintáctico y pruebas API
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/incident-hub"
        tar --exclude='.git' --exclude='backend/data/incidents.json' -czf "$(Build.ArtifactStagingDirectory)/incident-hub/incident-hub-$(Build.BuildId).tar.gz" .
      displayName: Empaquetar artefacto
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/incident-hub'
        ArtifactName: 'incident-hub'
        publishLocation: Container
      displayName: Publicar artefacto
