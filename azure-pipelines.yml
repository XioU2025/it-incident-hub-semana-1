
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: Default

variables:
  nodeVersion: '22.x'

stages:
- stage: Validate
  displayName: Validación y pruebas
  jobs:
  - job: BuildAndTest
    displayName: Instalar, validar y probar
    steps:
    - task: UseNode@1
      inputs:
        version: $(nodeVersion)
      displayName: Usar Node.js

    - script: npm ci
      displayName: Instalar dependencias

    - script: npm run check
      displayName: Lint sintáctico y pruebas API

    - powershell: |
        Write-Host "Prueba de fallo controlado"
        exit 1
      displayName: Prueba temporal de pipeline fallido

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\incident-hub'
        ArtifactName: 'incident-hub'
        publishLocation: Container
      displayName: Publicar artefacto
